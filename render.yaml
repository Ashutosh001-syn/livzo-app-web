services:
  - type: web
    name: livzo-app
    env: node
    buildCommand: npm install && npm run db:generate && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: AUTH_JWT_SECRET
        generateValue: true
      - key: AUTH_REFRESH_SECRET
        generateValue: true
      - key: DATABASE_URL
        value: "file:./data/dev.db"
    # We mount a persistent disk so that your SQLite database is not wiped when Render restarts the server!
    disk:
      name: sqlite-data
      mountPath: /opt/render/project/src/prisma/data
      sizeGB: 1
